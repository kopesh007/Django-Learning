
                <!--Showing Success Message-->
                {% if messages%}
                    {%for i in messages%}
                        <span class="fw-bold">{{i}}</span>
                    {%endfor%}
                {%endif%}

                    
                <div class="">
                    <!-- Error messages -->
                     {% for field in form%}
                    <div class="col-12">
                        {% if field.errors %}
                        <span class="fw-bold">{{field.label_tag}}</span>
                        {% for i in field.errors%}
                        <span class="text-danger">{{i}}</span>
                        {%endfor%}
                        {% endif %}
                    </div>
                    {%endfor%}

                </div>
                {%if form.non_field_errors%}
                <div class="col-12">
                    {% for error in form.non_field_errors%}
                    <span class="text-danger">{{error}}</span>
                    {%endfor%}
                </div>
                {%endif%}
